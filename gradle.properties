# Important Notes:
# Every field you add must be added to the buildSrc multiloader-common.gradle expandProps map
# (only fields used in templated resources; the parchment_* and primalmagick_modrinth_version fields are build-only).

# Project
group=com.claviger.primalmagickextended
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Primal Magick Extended
mod_author=claviger
mod_id=primalmagickextended
license=MIT
description=Extensions for Primal Magick: bind animal familiars, build coloured portals and more.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses
neo_form_version=1.21.1-20240808.144430
# ParchmentMC mappings, matching Primal Magick 6.0.7
parchment_minecraft=1.21
parchment_version=2024.07.28

# NeoForge
neoforge_version=21.1.132
neoforge_loader_version_range=[4,)

# Primal Magick, from Modrinth's maven: the version id of the official 6.0.7 NeoForge release
# (primalmagick-neoforge-1.21.1-6.0.7.jar)
primalmagick_modrinth_version=zdRhg0nF
primalmagick_version_range=[6.0.7,)

# JEI
jei_version=19.21.0.247

# Common Networking
common_network_version=1.0.18
common_network_mc_version=1.21.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=true
