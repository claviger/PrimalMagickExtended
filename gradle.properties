# Important Notes:
# Every field you add must be added to the buildSrc multiloader-common.gradle expandProps map.

# Project
group=com.claviger.primalmagickextended
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Primal Magick Extended
mod_author=claviger
mod_id=primalmagickextended
license=MIT
description=Extensions for Primal Magick: bind animal familiars and more.
minecraft_version_range=[26.1.2, 26.2)
## This is the version of minecraft that the 'common' project uses
neo_form_version=26.1.2-1

# NeoForge
neoforge_version=26.1.2.22-beta
neoforge_loader_version_range=[4,)

# Primal Magick (built jars are read from ${primalmagick_dir}/{common,neoforge}/build/libs)
# primalmagick_dir can be overridden with -Pprimalmagick_dir=... or in ~/.gradle/gradle.properties
primalmagick_dir=C:/tmp/pm-integration
primalmagick_version_range=[6.0.7,)

# JEI
jei_version=29.5.0.26

# Common Networking
common_network_version=1.0.22
common_network_mc_version=26.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=true
