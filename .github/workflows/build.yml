name: Build and Run Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gradle:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: Primal-Magick-Extended
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: claviger/PrimalMagick
        ref: port26integration
        path: PrimalMagick
        fetch-depth: 0
    # The fork carries no release tags, and Primal Magick's version comes from git describe; without the upstream
    # tags it is a bare commit hash, which NeoForge rejects, so this mod's [6.0.7,) dependency fails
    - name: Fetch Primal Magick release tags
      working-directory: ./PrimalMagick
      run: git fetch --tags https://github.com/daedalus4096/PrimalMagick.git
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 25
    - uses: gradle/actions/setup-gradle@v4
    - name: Build Primal Magick jars
      working-directory: ./PrimalMagick
      run: ./gradlew clean :common:jar :neoforge:jar --no-configuration-cache
    - name: Build mod JARs
      working-directory: ./Primal-Magick-Extended
      run: ./gradlew build -Pprimalmagick_dir=${{ github.workspace }}/PrimalMagick
    - name: Run NeoForge tests
      working-directory: ./Primal-Magick-Extended
      run: ./gradlew :neoforge:runGameTestServer -Pprimalmagick_dir=${{ github.workspace }}/PrimalMagick
