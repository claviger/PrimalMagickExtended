name: Build and Run Tests (1.21.1)
on:
  push:
    branches: ['mc/1.21.1']
  pull_request:
    branches: ['mc/1.21.1']
jobs:
  gradle:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0          # the mod version comes from the git tags
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21
    - uses: gradle/actions/setup-gradle@v4
    - name: Build mod JARs
      run: ./gradlew :neoforge:build
    - name: Run NeoForge tests
      run: ./gradlew :neoforge:runGameTestServer
